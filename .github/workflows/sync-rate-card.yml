name: Sync rate card from Box

# Box -> app. Every hour, download the MASTER rate card from Jon's Box folder; if it changed,
# rebuild the app data and the one-file app and commit. GitHub Pages then redeploys.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rate-card
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Pull master from Box and rebuild
        id: sync
        env:
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_SUBJECT_TYPE: ${{ vars.BOX_SUBJECT_TYPE || 'enterprise' }}
          BOX_SUBJECT_ID: ${{ secrets.BOX_SUBJECT_ID }}
          BOX_FOLDER_ID: ${{ vars.BOX_FOLDER_ID || '422333003231' }}
        run: |
          if [ -z "$BOX_CLIENT_ID" ]; then echo "Box secrets not set; skipping."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 military/tools/sync_from_box.py | tee sync.log
          grep -q 'CHANGED=true' sync.log && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Commit rebuilt app data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "rate-card-sync"
          git config user.email "rate-card-sync@users.noreply.github.com"
          git add military
          git commit -m "Sync rate card from Box ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
